<!-- skills/open-kitchen/kitchen.html -->
<!-- Approved 3D kitchen viewer with visible-only local snapshot transport and a browser handoff. -->
<meta charset="utf-8">
<title>Slice Kitchen</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.184.0/build/three.module.js"}}</script>
<style>
/* Layout: one full-bleed isometric kitchen; HUD floats on top as frosted pills and white cards. */
:root{
  --lawn:#9fb27a; --ink:#4a3426; --ink-soft:#7a604c; --cream:#fbf6ec; --card:#fffdf8;
  --accent:#c9643f; --accent-soft:#f6e1d3; --sage:#6c8a52; --sage-soft:#e5ecd9;
  --mustard:#d8a23c; --mustard-soft:#f8ecd0; --dusty:#5f7d93; --dusty-soft:#e1e9ef;
  --bad:#b8473a; --bad-soft:#f6dcd7; --line:rgba(74,52,38,.12);
  --display:'Fredoka',ui-rounded,system-ui,sans-serif; --body:'Nunito',system-ui,-apple-system,sans-serif;
  --shadow:0 10px 28px rgba(80,50,30,.18),0 1px 2px rgba(80,50,30,.08);
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--lawn);color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab}
#stage.grabbing{cursor:grabbing}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#ts1{filter:blur(1.4px);-webkit-mask-image:linear-gradient(to bottom,#000 0%,transparent 22%,transparent 78%,#000 100%);mask-image:linear-gradient(to bottom,#000 0%,transparent 22%,transparent 78%,#000 100%)}
#ts2{filter:blur(4px);-webkit-mask-image:linear-gradient(to bottom,#000 0%,transparent 11%,transparent 90%,#000 100%);mask-image:linear-gradient(to bottom,#000 0%,transparent 11%,transparent 90%,#000 100%)}
#dawn{position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(180deg,rgba(255,150,130,.4) 0%,rgba(255,190,165,.16) 40%,rgba(120,105,175,.16) 100%)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 75% at 50% 50%,transparent 58%,rgba(70,48,30,.18) 100%)}
#ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}

/* frosted pills, from the Copper Spoon HUD */
.pill{background:rgba(251,246,236,.8);-webkit-backdrop-filter:blur(12px) saturate(1.2);backdrop-filter:blur(12px) saturate(1.2);border:1px solid rgba(255,255,255,.75);border-radius:999px;box-shadow:0 8px 22px rgba(80,50,30,.16),inset 0 1px 0 rgba(255,255,255,.8)}
.hud{position:fixed;z-index:5;display:flex;gap:8px;align-items:center}
.top{top:calc(14px + env(safe-area-inset-top,0px));left:16px;right:280px;flex-wrap:wrap}
.tr{top:calc(14px + env(safe-area-inset-top,0px));right:16px}
.brand img{display:block;height:30px;width:auto}
.brand{display:flex;align-items:center;gap:8px;padding:6px 16px;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.1px}
.brand .mark{width:28px;height:28px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.brand .mark svg{width:17px;height:17px}
.demo{font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-soft);background:rgba(74,52,38,.07);padding:3px 8px;border-radius:999px}
.stat{display:flex;align-items:center;gap:6px;padding:7px 13px 7px 9px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.stat svg{width:20px;height:20px;flex:none}
.stat span{font-weight:600;color:var(--ink-soft);font-size:12.5px}
.iconbtn{width:42px;height:42px;display:grid;place-items:center;border:0;cursor:pointer}
.iconbtn svg{width:20px;height:20px}
.seg{display:flex;padding:4px;gap:2px}
.seg button{width:34px;height:34px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer}
.seg button.on{background:var(--mustard);color:#fff;box-shadow:0 2px 6px rgba(160,110,30,.35)}
.seg svg{width:18px;height:18px}

/* live baking tracker: one horizontal pill in the top bar */
.tracker{display:flex;align-items:center;gap:12px;padding:6px 14px 6px 12px;border:1px solid rgba(255,255,255,.75);cursor:pointer;font:inherit;color:inherit;min-width:0;max-width:100%}
.tracker:hover{background:rgba(255,253,248,.95)}
.tk-title{display:flex;flex-direction:column;line-height:1.1;text-align:left;min-width:0}
.tk-title small{font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--accent)}
.tk-title b{font-family:var(--display);font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-steps{display:flex;align-items:center;gap:3px}
.tk-steps i{display:block;width:16px;height:5px;border-radius:4px;background:rgba(74,52,38,.12)}
.tk-steps i.done{background:var(--sage)}
.tk-steps i.now{background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.tk-now{font-size:12.5px;font-weight:800;min-width:44px;text-align:left}
.tk-slices{display:flex;gap:4px;padding-left:10px;border-left:1px solid var(--line)}
.tk-slices i{display:block;width:10px;height:10px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(74,52,38,.12)}
.d-waiting{background:rgba(74,52,38,.12)}.d-cooking{background:var(--mustard)}.d-ready,.d-carrying{background:var(--dusty)}.d-plated{background:var(--accent)}.d-sent{background:var(--bad)}.d-passed{background:var(--sage)}
.sh-now{background:var(--accent-soft);border-radius:14px;padding:12px 14px;margin:0 0 6px}
.sh-now .eyebrow{font-size:11px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--accent)}
.sh-now h4{font-family:var(--display);font-weight:600;font-size:17px;margin:2px 0 10px}
.sh-meta{font-size:12.5px;font-weight:700;color:var(--ink-soft);margin:10px 0 0}
.slices{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.slices li{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:8px;font-size:13.5px;font-weight:600;min-width:0}
.slices .sid{font-variant-numeric:tabular-nums;color:var(--ink-soft);font-weight:700}
.slices .sname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.c-wait{background:rgba(74,52,38,.07);color:var(--ink-soft)}
.c-cook{background:var(--mustard-soft);color:#8a5d10}
.c-ready{background:var(--dusty-soft);color:var(--dusty)}
.c-plated{background:var(--accent-soft);color:#9a4626}
.c-sent{background:var(--bad-soft);color:var(--bad)}
.c-pass{background:var(--sage-soft);color:#4b6a33}

/* event feed */
#feed{position:fixed;z-index:4;left:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column-reverse;gap:6px;width:340px;max-width:calc(100vw - 32px);pointer-events:none}
.ev{background:linear-gradient(140deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.26) 50%,rgba(255,255,255,.44) 100%);-webkit-backdrop-filter:blur(18px) saturate(1.8) brightness(1.05);backdrop-filter:blur(18px) saturate(1.8) brightness(1.05);border:1px solid rgba(255,255,255,.72);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.3),0 16px 40px rgba(60,40,20,.2),0 2px 6px rgba(60,40,20,.1);border-radius:16px;padding:8px 13px;font-size:13px;font-weight:600;display:flex;gap:9px;align-items:baseline;animation:evIn .35s ease-out;transition:opacity .6s}
.ev time{font-size:11px;font-weight:800;color:var(--ink-soft);font-variant-numeric:tabular-nums;flex:none}
.ev.old{opacity:.7}
.ev.out{opacity:0;transform:translateY(-4px)}
@keyframes evIn{from{transform:translateY(8px);opacity:0}}

/* dock */
.dock{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;padding:5px}
.dock button{display:flex;align-items:center;gap:7px;border:0;background:transparent;padding:9px 14px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.dock button:hover{background:rgba(74,52,38,.07)}
.dock button.on{background:var(--ink);color:var(--cream)}
.dock svg{width:17px;height:17px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* side sheet */
#sheet{position:fixed;z-index:6;top:calc(68px + env(safe-area-inset-top,0px));right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:360px;max-width:calc(100vw - 32px);background:var(--card);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
.sh-head h3{font-family:var(--display);font-weight:600;font-size:20px;margin:0}
.sh-close{width:34px;height:34px;border-radius:50%;border:0;background:rgba(74,52,38,.07);cursor:pointer;display:grid;place-items:center}
.sh-close svg{width:16px;height:16px}
.sh-body{overflow:auto;padding:0 18px 18px;font-size:13.5px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;font-weight:700;color:var(--ink-soft);padding:2px 0 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px;border:1px solid rgba(0,0,0,.12)}
.crew h4{font-size:11px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--ink-soft);margin:16px 0 6px}
.crew p.cdesc{margin:-2px 0 8px;font-size:12.5px;color:var(--ink-soft)}
.member{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.member:last-child{border-bottom:0}
.av{width:30px;height:30px;border-radius:50%;position:relative;border:1px solid rgba(0,0,0,.08)}
.av::after{content:"";position:absolute;inset:6px 7px 9px;border-radius:50% 50% 45% 45%;background:var(--skin,#f2c9a8)}
.member b{display:block;font-size:13.5px}
.member code{font-size:11.5px;color:var(--ink-soft);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.tier{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}
.t-opus{background:#3a3532;color:#fbf6ec}.t-sonnet{background:#efe6d6;color:#6b5240}.t-haiku{background:var(--mustard-soft);color:#8a5d10}
.on-shift{width:8px;height:8px;border-radius:50%;background:var(--sage);display:inline-block;margin-left:6px;box-shadow:0 0 0 3px var(--sage-soft)}
.lrow{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;font-weight:600}
.lrow time{font-size:11.5px;font-weight:800;color:var(--ink-soft);font-variant-numeric:tabular-nums;padding-top:1px}
.lrow small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--accent)}
.orow{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.orow b{font-size:14px}.orow small{display:block;color:var(--ink-soft);font-weight:600;font-size:12px}
.orow .pn{font-family:var(--display);font-weight:600;font-size:15px;color:var(--ink-soft)}

/* in-world overlays */
.ring{position:absolute;left:0;top:0;width:44px;height:44px;margin:-86px 0 0 -22px;border-radius:50%;background:rgba(255,253,248,.95);box-shadow:0 4px 12px rgba(80,50,30,.22);display:grid;place-items:center;transition:opacity .25s,transform .1s linear}
.ring svg.r{position:absolute;inset:3px;width:38px;height:38px;transform:rotate(-90deg)}
.ring svg.r circle{fill:none;stroke-width:4}
.ring .bg{stroke:rgba(74,52,38,.12)}.ring .fg{stroke:var(--mustard);stroke-linecap:round;transition:stroke-dashoffset .15s linear}
.ring.done .fg{stroke:var(--sage)}.ring.bad .fg{stroke:var(--bad)}
.ring .ri{width:20px;height:20px;position:relative}
.ring .rl{position:absolute;top:47px;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(74,52,38,.86);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.bub{position:absolute;left:0;top:0;width:38px;height:38px;margin:-46px 0 0 -19px;border-radius:50%;background:#fffdf8;box-shadow:0 4px 12px rgba(80,50,30,.25);display:grid;place-items:center;animation:pop .28s cubic-bezier(.3,1.6,.6,1)}
.bub::after{content:"";position:absolute;bottom:-5px;left:50%;width:10px;height:10px;margin-left:-5px;background:#fffdf8;transform:rotate(45deg);border-radius:2px}
.bub svg{width:20px;height:20px;position:relative;z-index:1}
.bub.good{background:#e9f1dc}.bub.good::after{background:#e9f1dc}
.bub.bad{background:#f7dcd6}.bub.bad::after{background:#f7dcd6}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.say{position:absolute;left:0;top:0;transform:translate(-50%,-100%);margin-top:-44px;white-space:nowrap;font-family:var(--display);font-weight:600;font-size:14px;color:var(--ink);padding:6px 12px;border-radius:14px;background:linear-gradient(140deg,rgba(255,255,255,.8),rgba(255,255,255,.52));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.8);box-shadow:0 6px 16px rgba(60,40,20,.18);animation:sayIn .3s cubic-bezier(.3,1.5,.6,1)}
.say.chef{font-size:15px;background:linear-gradient(140deg,rgba(255,250,240,.92),rgba(255,240,225,.7))}
.say.reply{color:#9a2a20}
@keyframes sayIn{from{opacity:0;transform:translate(-50%,-80%) scale(.7)}}
.bbpop,.scpop{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none}
.bbpop span{position:absolute;left:0;bottom:0;transform:translateX(-50%);margin-bottom:12px;white-space:nowrap;font-family:var(--display);font-weight:600;letter-spacing:.6px;color:#fff;background:var(--tc);border:2px solid rgba(255,255,255,.92);border-radius:999px;box-shadow:0 8px 20px rgba(30,20,10,.28);animation:popIn .5s cubic-bezier(.2,1.6,.4,1) both,popOut .4s ease-in 1.95s forwards}
.bbpop.t1 span{font-size:14px;padding:3px 12px}
.bbpop.t2 span{font-size:18px;padding:4px 14px}
.bbpop.t3 span{font-size:22px;padding:5px 17px;animation:popIn .5s cubic-bezier(.2,1.6,.4,1) both,wob .45s ease-in-out .5s 2,popOut .4s ease-in 1.95s forwards}
.bbpop.t4 span{font-size:27px;padding:6px 20px;background:linear-gradient(135deg,var(--tc) 30%,#f3c14b);text-shadow:0 2px 0 rgba(0,0,0,.18);box-shadow:0 0 0 4px rgba(243,193,75,.35),0 12px 28px rgba(30,20,10,.3);animation:popIn .6s cubic-bezier(.2,1.7,.4,1) both,wob .45s ease-in-out .6s 3,popOut .5s ease-in 2.9s forwards}
.bbpop i{position:absolute;left:-3px;bottom:34px;width:7px;height:10px;border-radius:2px;opacity:0;animation:conf 1.5s cubic-bezier(.12,.75,.4,1) forwards}
@keyframes conf{0%{transform:translate(0,0) rotate(0);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 90px)) rotate(var(--r));opacity:0}}
@keyframes popIn{from{transform:translateX(-50%) scale(.2);opacity:0}}
@keyframes popOut{to{transform:translateX(-50%) translateY(-26px) scale(.92);opacity:0}}
@keyframes wob{50%{transform:translateX(-50%) rotate(-4deg) scale(1.07)}}
.scpop .sc{position:absolute;left:0;bottom:0;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 18px 8px 10px;border-radius:999px;white-space:nowrap;font-family:var(--display);font-weight:600;color:var(--ink);background:linear-gradient(140deg,rgba(255,255,255,.7),rgba(255,255,255,.3) 50%,rgba(255,255,255,.5));-webkit-backdrop-filter:blur(16px) saturate(1.8);backdrop-filter:blur(16px) saturate(1.8);border:1px solid rgba(255,255,255,.8);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),0 14px 32px rgba(60,40,20,.25);animation:popIn .55s cubic-bezier(.2,1.5,.4,1) both,popOut .5s ease-in 2.7s forwards}
.scpop i{width:10px;height:30px;border-radius:4px;background:var(--tc)}
.scpop b{font-size:19px;letter-spacing:.6px}
.scpop .roll{display:inline-block;height:36px;overflow:hidden;line-height:36px;font-size:32px;color:var(--tc);min-width:24px;text-align:center}
.scpop .roll em{display:block;font-style:normal;animation:roll .5s cubic-bezier(.3,1.5,.5,1) .55s forwards}
@keyframes roll{to{transform:translateY(-100%)}}
.scpop small{font-size:13px;color:var(--ink-soft);margin-left:2px}
@media (prefers-reduced-motion:reduce){.bbpop i{display:none}}
.cntw{position:absolute;left:0;top:0;width:0;height:0}
.cnt{position:absolute;left:0;bottom:0;transform:translateX(-50%);margin-bottom:6px;display:flex;align-items:center;gap:4px;padding:4px 11px;border-radius:999px;white-space:nowrap;font-family:var(--body);font-weight:800;font-size:10.5px;color:var(--ink);background:linear-gradient(140deg,rgba(255,255,255,.66),rgba(255,255,255,.28) 50%,rgba(255,255,255,.46));-webkit-backdrop-filter:blur(14px) saturate(1.8);backdrop-filter:blur(14px) saturate(1.8);border:1px solid rgba(255,255,255,.78);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 6px 16px rgba(60,40,20,.2)}
.cnt b{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.5px;margin-right:2px}
.cnt i{width:7px;height:7px;border-radius:50%;background:rgba(74,52,38,.18);display:inline-block}
.cnt i.b{background:#5f9e45}.cnt i.s{background:#e0a020}
.cnt .lb{color:var(--ink-soft);margin:0 1px 0 3px}.cnt .sep{width:1px;height:12px;background:rgba(74,52,38,.2);margin:0 3px}
.say.ump{margin-top:-40px;font-family:var(--body);font-weight:800;font-size:12px;letter-spacing:.3px;padding:3px 10px;border-radius:999px;color:#fff;background:rgba(40,42,52,.9);border:0;box-shadow:0 2px 8px rgba(20,20,30,.3);animation:softIn .3s ease}
.say.soft{margin-top:-34px;font-family:var(--body);font-weight:700;font-size:11px;padding:2px 8px;border-radius:999px;color:rgba(58,44,38,.88);background:rgba(255,253,248,.72);border:0;box-shadow:0 1px 4px rgba(60,40,20,.12);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:softIn .5s ease}
@keyframes softIn{from{opacity:0;transform:translate(-50%,-90%)}}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-150%);white-space:nowrap;background:rgba(255,253,248,.95);font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;box-shadow:0 2px 8px rgba(80,50,30,.18);color:var(--ink-soft);transition:background .4s,color .4s,box-shadow .4s}
.tag.active{color:#5a3b06;background:linear-gradient(180deg,#ffe9a8,#f3c14b);box-shadow:0 0 0 3px rgba(243,193,75,.35),0 4px 14px rgba(200,140,20,.45);font-size:12px;padding:3px 10px}
.tag.active::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#c9643f;margin-right:6px;vertical-align:1px;animation:pulse 1.2s ease-in-out infinite}
.tag.new{color:#fff;background:var(--dusty);box-shadow:0 4px 12px rgba(60,80,110,.35)}
.float{position:absolute;left:0;top:0;font-family:var(--display);font-weight:600;font-size:16px;color:#fff;background:var(--sage);padding:3px 10px;border-radius:999px;box-shadow:0 4px 12px rgba(60,80,40,.35);animation:rise 1.8s ease-out forwards;white-space:nowrap}
@keyframes rise{from{transform:translate(-50%,-40px);opacity:1}to{transform:translate(-50%,-110px);opacity:0}}

/* phase callout: floats above the shop, fades in and out slowly */
#callouts{position:fixed;inset:0;z-index:4;pointer-events:none}
.co{position:absolute;left:50%;top:22%;display:flex;align-items:center;gap:14px;padding:13px 30px 13px 14px;border-radius:999px;white-space:nowrap;font-family:var(--display);font-weight:600;font-size:27px;letter-spacing:.1px;color:var(--ink);
  background:linear-gradient(140deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.22) 48%,rgba(255,255,255,.4) 100%);
  -webkit-backdrop-filter:blur(20px) saturate(1.9) brightness(1.06);backdrop-filter:blur(20px) saturate(1.9) brightness(1.06);
  border:1px solid rgba(255,255,255,.75);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),inset 0 -14px 24px rgba(255,255,255,.14),0 22px 48px rgba(60,40,20,.24),0 2px 6px rgba(60,40,20,.12);

<script id="kitchen-live">
// Snapshot delivery stays independent of scene initialization and rendering.
(() => {
  const interval = 3000;
  const button = document.getElementById('bOpen');
  let snapshot = null;
  let timer = null;
  let controller = null;
  const visible = () => document.visibilityState !== 'hidden';
  const validPort = port => Number.isInteger(port) && port > 0 && port <= 65535;

  // A small read-only seam for the next scene driver and browser verification.
  Object.defineProperty(window, 'kitchenLive', {
    value: Object.freeze({ get snapshot() { return snapshot; }, eventName: 'kitchen:state' }),
    configurable: false,
    writable: false,
  });

  function deliver(next) {
    if (!next || typeof next !== 'object' || typeof next.project?.root !== 'string' || !validPort(next.port)) return;
    snapshot = next;
    button.disabled = false;
    button.title = 'Open this kitchen in your default browser';
    window.dispatchEvent(new CustomEvent('kitchen:state', { detail: next }));
    try {
      if (typeof window.liveDriver === 'function') window.liveDriver(next);
      else if (typeof window.liveDriver?.applySnapshot === 'function') window.liveDriver.applySnapshot(next);
    } catch {
      // Scene failures cannot stop local snapshot delivery.
    }
  }

  window.__kitchenFeed = deliver;

  button.addEventListener('click', () => {
    if (validPort(snapshot?.port)) window.open(`http://127.0.0.1:${snapshot.port}/`, '_blank', 'noopener');
  });

  async function poll() {
    if (!visible() || controller) return;
    // This slice serves locally only. A standalone mockup keeps its existing behavior.
    if (location.protocol !== 'http:' || location.hostname !== '127.0.0.1') return;
    const request = new AbortController();
    controller = request;
    const timeout = setTimeout(() => request.abort(), 2500);
    try {
      const response = await fetch('/state', {
        cache: 'no-store', credentials: 'omit', redirect: 'error', signal: request.signal,
      });
      if (response.ok) {
        const next = await response.json();
        if (visible() && !request.signal.aborted) deliver(next);
      }
    } catch {
      // Reconnect on the next visible poll; the original kitchen keeps running.
    } finally {
      clearTimeout(timeout);
      controller = null;
      if (visible()) timer = setTimeout(poll, interval);
    }
  }

  document.addEventListener('visibilitychange', () => {
    clearTimeout(timer);
    if (!visible()) controller?.abort();
    else if (!controller) poll();
  });
  if (visible()) poll();
})();
</script>

<script id="kitchen-cast">
// Diff full snapshots independently of Three.js so replay and repeated polls stay deterministic.
window.createKitchenCastDriver = function ({ roster, emit, demo, live }) {
  let mode = null, projectRoot = null;
  let active = new Map(), skills = new Map();
  const keyFor = row => JSON.stringify([row.sid || '', row.aid]);
  const skillKey = row => JSON.stringify([row.sid || '', row.name, row.startedAt]);
  function assign(row) {
    const plugin = row.type.startsWith('bytheslice:');
    const type = plugin ? row.type.slice('bytheslice:'.length) : row.type;
    const used = new Set([...active.values()].map(item => item.character.id));
    const known = plugin && roster[type];
    if (known && !used.has(type)) return { ...known, plugin, type };
    if (known && roster[type + '#2'] && !used.has(type + '#2')) return { ...roster[type + '#2'], plugin, type };
    const crew = known ? known.crew : plugin ? 'line' : 'pass';
    let number = 1;
    while (used.has(`helper:${crew}:${number}`)) number++;
    return { id: `helper:${crew}:${number}`, name: plugin ? `${crew} helper ${number}` : `Temp ${number}`,
      crew, tier: known?.tier || 'sonnet', role: plugin ? `Extra ${type} in the ${crew} division.` : `Temp helper: ${type}.`, plugin, type };
  }
  function apply(snapshot) {
    if (!snapshot || typeof snapshot.project?.setup !== 'string') return;
    if (snapshot.project.setup === 'none') {
      active = new Map(); skills = new Map(); projectRoot = null;
      if (mode !== 'demo') { mode = 'demo'; demo(); }
      return;
    }
    if (mode !== 'live' || projectRoot !== snapshot.project.root) {
      active = new Map(); skills = new Map(); mode = 'live'; projectRoot = snapshot.project.root;
      live(snapshot);
    }
    const rows = (Array.isArray(snapshot.active) ? snapshot.active : [])
      .filter(row => typeof row?.aid === 'string' && typeof row.type === 'string');
    const incoming = new Set(rows.map(keyFor));
    for (const [key, entry] of active) if (!incoming.has(key)) {
      const finish = [...(snapshot.recent || [])].reverse().find(row => row.aid === entry.row.aid &&
        (!row.sid || row.sid === entry.row.sid) && typeof row.ok === 'boolean');
      emit('agentOff', { ...entry, ok: finish?.ok !== false }); active.delete(key);
    }
    for (const row of rows) {
      const key = keyFor(row), previous = active.get(key);

      active.set(key, entry);

    }
    const incomingSkills = new Map((Array.isArray(snapshot.skills) ? snapshot.skills : [])
      .filter(row => row.status === 'active' && typeof row.name === 'string').map(row => [skillKey(row), row]));
    for (const [key, row] of skills) if (!incomingSkills.has(key)) emit('skillOff', { key, row });
    for (const [key, row] of incomingSkills) if (!skills.has(key)) emit('skillOn', { key, row });

};
</script>

<script id="kitchen-build-out">
// Presence and install diffs are independent of rendering and retain actual file evidence.
window.createKitchenBuildDriver = function ({ render }) {
  let root = null;
  const previous = new Map();
  const names = ['walls', 'menu', 'tickets', 'case', 'safe', 'oven', 'alarm', 'locks'];
  function apply(snapshot) {
    if (!snapshot?.project) return;
    const changedRoot = root !== snapshot.project.root;
    if (changedRoot) { root = snapshot.project.root; previous.clear(); }
    for (const name of names) {
      const raw = snapshot.project.pieces?.[name];

      const present = typeof raw === 'boolean' ? raw : raw ? raw.present === true : snapshot.project.setup !== 'none';
      const applicable = typeof raw === 'object' && raw !== null ? raw.applicable !== false : true;

      const old = previous.get(name);

      previous.set(name, state);
    }
  }
  return Object.freeze({ apply });
};
</script>
